[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-langgraph"
version = "0.1.2"
description = "LangGraph adapter for VSL (VERBA Specification Language) governance primitives -- implements vsl-core's VSLAdapter conformance contract."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # vsl-core, published on PyPI as super-semantics-vsl (imported as vsl_core).
    "super-semantics-vsl>=0.3,<0.4",
    "langgraph>=0.2",
]
keywords = ["governance", "ai-safety", "guardrails", "langgraph", "vsl", "verba"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/supersemantics/VSL-Langgraph"
Repository = "https://github.com/supersemantics/VSL-Langgraph"
Changelog = "https://github.com/supersemantics/VSL-Langgraph/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/supersemantics/VSL-Langgraph/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
# Only examples/research_publish_agent.py needs these -- src/vsl_langgraph
# itself never imports a provider SDK, staying model-agnostic same as vsl-core.
examples = ["openai>=1.0", "anthropic>=0.40", "google-genai>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
