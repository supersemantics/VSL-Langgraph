[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-langgraph"
version = "0.1.1"
description = "LangGraph adapter for VSL (VERBA Specification Language) governance primitives -- implements vsl-core's VSLAdapter conformance contract."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # vsl-core (dist name super-semantics-vsl) isn't on PyPI yet, so it is
    # installed from GitHub, pinned to a release tag so an install can't
    # change under you when vsl-core's main moves. An application that
    # installs vsl-core itself must name exactly this URL (pip refuses two
    # different URLs for one package). Switch to a version pin once vsl-core
    # is on PyPI; PyPI rejects direct-URL dependencies at upload time.
    "super-semantics-vsl @ git+https://github.com/supersemantics/VSL-Core.git@v0.3.0",
    "langgraph>=0.2",
]
keywords = ["governance", "ai-safety", "guardrails", "langgraph", "vsl", "verba"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
# Only examples/research_publish_agent.py needs these -- src/vsl_langgraph
# itself never imports a provider SDK, staying model-agnostic same as vsl-core.
examples = ["openai>=1.0", "anthropic>=0.40", "google-genai>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
